<header>
    <div id="navbar"></div>
</header>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('/components/menu.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('footer-menu').innerHTML = html;
            })
            .catch(error => console.error('Error loading menu:', error));
    });
    </script>
