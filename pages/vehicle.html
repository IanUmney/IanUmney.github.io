<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pickup Fundraiser Fill</title>
<style>
  :root {
    --raised: 4500;   /* hard-coded */
    --goal: 10000;    /* hard-coded */
    --fill: calc(var(--raised) / var(--goal));

    /* Ukrainian colour scheme */
    --blue: #0057b7;
    --yellow: #ffd500;

    --bg: #001529;
    --text: #e8eef7;
    --muted: #9fb3d1;
    --can-width: 340px;
  }

  * { box-sizing:border-box; }
  body {
    margin:0;
    background: linear-gradient(180deg, var(--blue) 0%, var(--yellow) 100%);
    display:flex;
    justify-content:center;
    padding:40px;
    font-family: system-ui, sans-serif;
    color: var(--text);
  }

  .wrap { 
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
    padding:30px;
    border-radius:20px;
    max-width:900px;
    width:100%;
    box-shadow:0 8px 25px rgba(0,0,0,0.35);
  }

  h1 { margin:0 0 10px; font-weight:700; }
  p { margin:0 0 20px; color: var(--muted); }

  .pickup {
    width:var(--can-width);
    height:calc(var(--can-width) * 0.55);
    position:relative;
    margin:auto;
  }

  svg { width:100%; height:100%; display:block; }

  .liquid {
    transform-origin: 0 100%;
    transform: scaleY(var(--fill));
    transition: transform 900ms cubic-bezier(.22,1,.36,1);
  }

  .pct {
    position:absolute;
    right:10px;
    bottom:10px;
    background:rgba(0,0,0,0.45);
    padding:8px 10px;
    border-radius:12px;
    font-weight:700;
  }

  /* Donation section */
  #donateToggle {
    margin-top:25px;
    padding:14px 20px;
    border:none;
    border-radius:14px;
    background:var(--yellow);
    color:#000;
    font-weight:700;
    cursor:pointer;
  }

  #donateSection { display:none; text-align:center; margin-top:20px; }
  a.btn {
    background:var(--blue);
    color:white;
    padding:12px 20px;
    border-radius:10px;
    text-decoration:none;
    font-weight:700;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pickup Fuel & Logistics Fund</h1>
  <p>Hard-coded example: £4,500 raised out of £10,000 goal.</p>

  <div class="pickup">
    <div class="pct">45%</div>

    <!-- Pickup SVG -->
    <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Clip area inside truck bed -->
        <clipPath id="bedClip">
          <rect x="60" y="70" width="200" height="60" rx="6" />
        </clipPath>

        <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--yellow)" />
          <stop offset="100%" stop-color="var(--yellow)" stop-opacity="0.85" />
        </linearGradient>
      </defs>

      <!-- Liquid bed fill -->
      <g clip-path="url(#bedClip)">
        <rect class="liquid" x="60" y="70" width="200" height="60" fill="url(#liquidGrad)" />
      </g>

      <!-- Truck outline -->
      <rect x="50" y="60" width="220" height="80" rx="10" fill="rgba(255,255,255,0.12)" stroke="#000" stroke-width="3" />
      <rect x="190" y="60" width="80" height="40" rx="6" fill="rgba(255,255,255,0.12)" stroke="#000" stroke-width="3" />

      <!-- Wheels -->
      <circle cx="110" cy="150" r="22" fill="#111" stroke="#eee" stroke-width="4" />
      <circle cx="240" cy="150" r="22" fill="#111" stroke="#eee" stroke-width="4" />
    </svg>
  </div>

  <div style="text-align:center;">
    <button id="donateToggle">Donate</button>
  </div>

  <div id="donateSection">
    <p>Scan or tap to help keep the pickups running.</p>
    <img src="QR-CODE-URL" alt="QR" style="width:160px; height:160px; margin-bottom:15px;" />
    <br>
    <a href="DONATION-LINK" class="btn">Donate Online</a>
  </div>
</div>

<script>
  const toggle = document.getElementById('donateToggle');
  const section = document.getElementById('donateSection');

  toggle.addEventListener('click', () => {
    section.style.display = section.style.display === 'none' ? 'block' : 'none';
  });
</script>
</body>
</html>
